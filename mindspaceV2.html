<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4fbf8">
  <meta name="description" content="MindSpace: um espaço gratuito para registro emocional, bem-estar e informações sobre apoio profissional.">
  <title>MindSpace — Apoio emocional</title>
  <style>
    /* ============================================================
       01. DESIGN SYSTEM — identidade visual baseada no TCC
       ============================================================ */
    :root {
      --forest: #064d43;
      --forest-2: #0d6253;
      --green: #168f71;
      --mint: #2f9a7e;
      --mint-light: #e5f6f0;
      --bg: #f5fbf9;
      --white: #ffffff;
      --text: #102e2b;
      --muted: #527d75;
      --border: #d5e8e3;
      --shadow: 0 16px 40px rgba(23, 79, 70, .055);
      --radius: 19px;
      --danger: #9c3047;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: Arial, Helvetica, sans-serif; line-height: 1.52; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .52; cursor: not-allowed; }
    a { color: var(--green); }
    a:hover { color: var(--forest); }
    :focus-visible { outline: 3px solid #e4a535; outline-offset: 4px; }
    ::selection { background: #a5e6d4; }
    .container { width: min(100% - 72px, 1385px); margin-inline: auto; }
    .app-shell { min-height: 100vh; background: radial-gradient(ellipse at 50% 30%, #f6fffc 0%, #f2faf7 61%, #fff 120%); }
    .site-header { background: rgba(255,255,255,.94); border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 1515px; margin: auto; height: 129px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 35px; }
    .brand { display: inline-flex; align-items: center; gap: 6px; color: var(--forest); text-decoration: none; white-space: nowrap; flex: none; }
    .brand-icon { width: 100px; height: 72px; object-fit: contain; }
    .brand-copy { display: inline-flex; flex-direction: column; justify-content: center; margin-left: -6px; }
    .brand-word { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(26px, 3vw, 45px); font-weight: 700; letter-spacing: -2.5px; line-height: .98; }
    .brand-word em, .brand-word span { color: #18a27b; font-style: normal; }
    .brand-subtitle { margin-top: 4px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    .brand.compact .brand-icon { width: 79px; height: 60px; }
    .brand.compact .brand-word { font-size: 31px; letter-spacing: -1.2px; }
    .brand.compact .brand-subtitle { display: none; }
    .nav-right { display: flex; align-items: center; gap: 42px; }
    .nav-link, .link-button { border: 0; background: transparent; color: var(--muted); text-decoration: none; padding: 10px 0; font-size: 25px; }
    .nav-link:hover, .link-button:hover { color: var(--green); }
    .btn { border: 1px solid transparent; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 24px; min-height: 49px; background: transparent; color: var(--forest); font-weight: 700; font-size: 16px; text-decoration: none; transition: background .18s, border-color .18s, transform .18s; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn-primary { background: linear-gradient(120deg, #239b79 0%, #2c987c 100%); color: white; border-color: #208c72; }
    .btn-primary:hover:not(:disabled) { background: #137b61; color: white; }
    .btn-outline { border: 1.5px solid #77c2ae; color: var(--forest); background: rgba(255,255,255,.2); }
    .btn-outline:hover:not(:disabled) { background: #e8f6f1; }
    .btn-light { background: #edf8f4; border: 1px solid var(--border); }
    .btn-danger { border-color: #e9c5cd; color: var(--danger); background: white; }
    .btn-danger:hover { background: #fff0f2; }
    .btn-big { min-height: 84px; padding: 18px 48px; font-size: 28px; border-radius: 13px; }
    .btn-block { width: 100%; }
    .btn-small { padding: 8px 14px; font-size: 14px; min-height: 39px; }
    .text-muted { color: var(--muted); }
    .small { font-size: 13px; }
    .eyebrow { color: var(--green); font-weight: 800; text-transform: uppercase; letter-spacing: .19em; font-size: 19px; }
    h1,h2,h3,p { margin-top: 0; }
    h1,h2,h3 { line-height: 1.18; }
    h1 { letter-spacing: -.03em; }
    .soft-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .svg-icon { width: 26px; height: 26px; flex: none; vertical-align: middle; }
    .feature-icon { color: var(--green); width: 43px; height: 43px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .wrap-actions { display: flex; flex-wrap: wrap; gap: 11px; align-items: center; }
    .section-heading { margin-bottom: 26px; }
    .section-heading h1, .section-heading h2 { color: var(--forest); font-size: clamp(27px, 3vw, 36px); margin-bottom: 9px; }
    .section-heading p { color: var(--muted); font-size: 17px; }
    .back-link { display: inline-flex; align-items: center; gap: 9px; padding: 9px 0; margin-bottom: 22px; color: var(--forest); font-weight: 700; background: transparent; border: 0; font-size: 15px; }
    .back-link:hover { color: var(--green); }
    .inner-page { padding-top: 37px; padding-bottom: 75px; }
    .form-row { margin-bottom: 21px; }
    .form-row label { display: block; font-weight: 700; color: var(--forest); margin-bottom: 9px; }
    .field { display: block; width: 100%; min-height: 49px; border: 1.5px solid #bcd8d0; background: white; border-radius: 11px; padding: 12px 15px; color: var(--text); }
    textarea.field { min-height: 150px; resize: vertical; }
    .field:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px #bde9dc; }
    .field:invalid:not(:placeholder-shown) { border-color: #c36c75; }
    .field-dark { background: #242625; border: 1px solid #a3b7b0; color: white; min-height: 60px; font-size: 19px; }
    .field-dark::placeholder { color: #bcc5c5; }
    .form-error { color: #9a2940; font-weight: 700; font-size: 14px; margin: 0 0 18px; background: #fff0f2; padding: 10px 14px; border-radius: 9px; }
    .note { padding: 15px 18px; border-radius: 12px; background: #edf8f4; border: 1px solid #c4e5d9; color: #285e53; font-size: 14px; }
    .note-warning { background: #fff9eb; border-color: #f0deb0; color: #675021; }
    .danger-note { border: 1px solid #ecc4cb; background: #fff3f5; color: #772b3f; border-radius: 13px; padding: 18px 20px; }
    .empty-state { padding: 45px 20px; text-align: center; color: var(--muted); border: 1px dashed #b9d7ce; background: #fafffd; border-radius: 15px; }
    .empty-state .svg-icon { width: 40px; height: 40px; color: var(--green); margin-bottom: 12px; }
    /* ============================================================
       02. LANDING PAGE — reproduz composição das referências
       ============================================================ */
    .hero { text-align: center; padding: 108px 20px 64px; min-height: 659px; }
    .hero .eyebrow { font-size: 28px; letter-spacing: .18em; margin-bottom: 28px; }
    .hero h1 { margin: 0 auto 30px; max-width: 820px; font-size: clamp(43px, 5vw, 70px); color: var(--forest); font-weight: 750; line-height: 1.2; }
    .hero p { color: var(--muted); max-width: 920px; margin: 0 auto 52px; font-size: clamp(19px, 2.2vw, 31px); line-height: 1.53; }
    .hero-actions { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
    .hero-actions .btn:first-child { min-width: 319px; }
    .hero-actions .btn:last-child { min-width: 258px; }
    .landing-features { display: grid; grid-template-columns: repeat(4,1fr); border-block: 1px solid var(--border); background: #fff; }
    .landing-feature { padding: 45px 20px 70px; border-right: 1px solid var(--border); text-align: center; display: flex; align-items: center; flex-direction: column; gap: 22px; color: var(--forest); font-size: 24px; font-weight: 700; }
    .landing-feature:last-child { border-right: none; }
    .about-section { padding: 90px 0; }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: stretch; }
    .about-section h2 { font-size: 40px; margin: 16px 0; color: var(--forest); }
    .about-section p { font-size: 18px; color: var(--muted); }
    .about-card { padding: 32px; display: grid; gap: 14px; }
    .about-fact { display: flex; align-items: center; gap: 14px; color: var(--forest); font-weight: 700; }
    .about-fact .svg-icon { color: var(--green); }
    .footer { background: #fff; border-top: 1px solid var(--border); padding: 25px; text-align: center; color: var(--muted); font-size: 13px; }
    /* ============================================================
       03. AUTENTICAÇÃO — login, cadastro e privacidade
       ============================================================ */
    .auth-page { min-height: 100vh; padding: 50px 24px; display: grid; place-items: center; }
    .auth-card { width: min(100%, 634px); padding: 40px 46px 34px; border: 1px solid #d0e5de; border-radius: 19px; background: #fff; }
    .auth-brand { display: flex; justify-content: center; margin-bottom: 13px; }
    .auth-mark { width: 116px; height: 78px; object-fit: contain; }
    .auth-card h1 { font-size: 36px; text-align: center; margin-bottom: 3px; color: var(--forest); }
    .auth-lead { font-size: 23px; color: var(--muted); text-align: center; margin-bottom: 45px; }
    .auth-card .form-row { margin-bottom: 29px; }
    .auth-card .form-row label { font-size: 21px; }
    .auth-card .btn-block { min-height: 70px; font-size: 25px; }
    .auth-switch { text-align: center; color: var(--muted); margin: 30px 0 0; font-size: 19px; font-weight: 600; }
    .auth-switch button, .forgot-button { color: var(--green); background: transparent; border: 0; font-weight: 700; padding: 3px; }
    .auth-switch button:hover, .forgot-button:hover { text-decoration: underline; }
    .auth-meta { display: flex; justify-content: flex-end; margin: -13px 0 24px; }
    .auth-disclaimer { margin-top: 24px; font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; }
    /* ============================================================
       04. DASHBOARD E CARDS
       ============================================================ */
    .dashboard { padding-top: 49px; padding-bottom: 90px; }
    .dashboard .hello { font-size: 37px; color: #101b1b; font-weight: 500; margin-bottom: 4px; }
    .dashboard .question { font-size: 29px; color: var(--muted); margin-bottom: 37px; }
    .account-pill { border: none; width: 67px; height: 67px; border-radius: 50%; color: var(--forest); background: #d6f2e9; font-size: 22px; }
    .account-pill:hover { box-shadow: 0 0 0 3px #8cd4bf; }
    .mood-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 22px; margin-bottom: 10px; }
    .mood-option { min-height: 103px; background: #fff; border: 1.5px solid var(--border); border-radius: 18px; color: #829e9a; display: flex; align-items: center; justify-content: center; }
    .mood-option .mood-graphic { width: 43px; height: 43px; }
    .mood-option:hover { background: #f2fbf7; border-color: #8dd1bc; }
    .mood-option.selected { background: #e3f4ee; border: 2px solid #159c78; color: var(--forest); }
    .mood-confirm { min-height: 27px; margin-bottom: 29px; color: var(--muted); font-size: 13px; }
    .section-label { font-size: 26px; color: #78928d; font-weight: 800; text-transform: uppercase; margin: 18px 0 19px; }
    .resource-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 25px; }
    .resource-card { min-height: 213px; padding: 37px; background: #fff; border: 1.5px solid var(--border); border-radius: 18px; text-align: left; color: var(--text); display: flex; flex-direction: column; justify-content: center; gap: 7px; }
    .resource-card .feature-icon { margin-bottom: 15px; }
    .resource-card strong { font-size: 28px; line-height: 1.2; font-weight: 650; }
    .resource-card .resource-description { font-size: 23px; color: #6c8a82; }
    .resource-card:hover { background: #fafffd; border-color: var(--green); box-shadow: 0 10px 28px #174f4611; transform: translateY(-2px); }
    /* ============================================================
       05. TELAS INTERNAS, REGISTROS E RESULTADOS
       ============================================================ */
    .content-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items: start; }
    .panel { padding: 27px; }
    .panel h2 { color: var(--forest); font-size: 23px; margin-bottom: 18px; }
    .entry-card { padding: 22px 24px; margin-bottom: 15px; }
    .entry-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
    .entry-head strong { color: var(--forest); }
    .entry-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 17px; color: #334f49; }
    .tag { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 99px; background: var(--mint-light); color: var(--forest); font-weight: 700; font-size: 13px; }
    .tag .mood-graphic { width: 23px; height: 23px; }
    .chart-wrap { overflow-x: auto; }
    .chart-wrap svg { max-width: 100%; height: auto; display: block; }
    .chart-caption { color: var(--muted); font-size: 13px; margin: 0; }
    .choice-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
    .choice-card { border: 1.5px solid var(--border); border-radius: 17px; text-align: left; background: white; padding: 28px; color: var(--forest); }
    .choice-card .feature-icon { width: 38px; height: 38px; }
    .choice-card h3 { margin: 18px 0 8px; font-size: 24px; }
    .choice-card p { color: var(--muted); margin-bottom: 0; }
    .choice-card:hover { border-color: var(--green); background: #f8fffc; }
    .question-card { padding: 22px 24px; margin: 14px 0; }
    .question-card legend { padding: 0 7px 0 0; color: var(--forest); font-size: 16px; font-weight: 700; }
    .question-card fieldset { border: none; padding: 0; margin: 0; min-width: 0; }
    .answers { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 20px; }
    .answer { position: relative; }
    .answer input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .answer span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 65px; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border); color: var(--muted); background: #fff; font-size: 13px; line-height: 1.24; }
    .answer input:checked + span { background: #dcf4eb; border: 2px solid var(--green); color: var(--forest); font-weight: 700; }
    .answer input:focus-visible + span { outline: 3px solid #e4a535; outline-offset: 2px; }
    .result-hero { padding: 29px; background: #f8fffc; }
    .result-number { font-size: 60px; color: var(--forest); font-weight: 750; margin: 5px 0 0; }
    .result-band { font-size: 20px; font-weight: 700; margin: 0 0 15px; color: var(--green); }
    .history-row { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border); }
    .history-row:last-child { border-bottom: none; }
    .history-row strong { display: block; color: var(--forest); }
    .history-row small { color: var(--muted); }
    .history-row .tag { white-space: nowrap; }
    .profile-avatar { border-radius: 50%; width: 80px; height: 80px; display: grid; place-items: center; color: var(--forest); background: #d9f5eb; font-size: 28px; font-weight: 700; }
    .profile-top { display: flex; align-items: center; gap: 22px; margin-bottom: 25px; }
    .profile-top h2 { margin: 0 0 4px; }
    .profile-top p { color: var(--muted); margin: 0; overflow-wrap: anywhere; }
    /* ============================================================
       06. CONTEÚDOS, RESPIRAÇÃO E APOIO PROFISSIONAL
       ============================================================ */
    .content-list { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
    .content-tile { padding: 25px; text-align: left; background: white; color: var(--forest); border: 1.5px solid var(--border); border-radius: 15px; }
    .content-tile h3 { margin: 13px 0 6px; font-size: 19px; }
    .content-tile p { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    .content-tile:hover { border-color: var(--green); background: #fafffd; }
    .step-list { counter-reset: steps; list-style: none; padding: 0; }
    .step-list li { counter-increment: steps; display: flex; gap: 15px; margin: 0 0 18px; align-items: flex-start; }
    .step-list li::before { content: counter(steps); display: grid; place-items: center; width: 32px; height: 32px; flex: none; background: var(--mint-light); border-radius: 50%; color: var(--forest); font-weight: 800; }
    .breath-panel { padding: 31px; text-align: center; }
    .breath-circle-stage { width: 260px; height: 260px; margin: 26px auto; display: grid; place-items: center; }
    .breath-circle { width: 160px; height: 160px; background: radial-gradient(circle at 30% 30%, #7ed0b2, #2e9879); border-radius: 50%; box-shadow: 0 12px 48px rgba(28,151,111,.18); display: grid; place-items: center; color: white; font-weight: 700; transition: transform 3.9s ease-in-out; }
    .breath-circle.inspire { transform: scale(1.48); }
    .breath-circle.hold { transform: scale(1.48); }
    .breath-circle.expire { transform: scale(.94); transition-duration: 5.9s; }
    .breath-count { font-size: 35px; display: block; line-height: 1.2; }
    .breath-label { font-size: 22px; font-weight: 700; color: var(--forest); }
    .support-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 22px; }
    .support-card { padding: 28px; }
    .support-card h2 { color: var(--forest); margin: 14px 0 10px; font-size: 24px; }
    .support-card p { color: var(--muted); min-height: 50px; }
    .support-card .feature-icon { width: 38px; height: 38px; }
    .toast { position: fixed; bottom: 24px; right: 24px; max-width: calc(100vw - 35px); padding: 13px 20px; background: var(--forest); color: white; border-radius: 12px; box-shadow: 0 8px 30px #003b3044; z-index: 100; opacity: 0; pointer-events: none; transform: translateY(16px); transition: .2s; }
    .toast.shown { opacity: 1; transform: translateY(0); }
    @media(max-width:900px) {
      .header-inner { height: 94px; padding-inline: 22px; }
      .brand-icon { width: 80px; height: 58px; }
      .brand-word { font-size: 32px; }
      .nav-right { gap: 20px; }
      .nav-link { font-size: 17px; }
      .hero { min-height: auto; padding: 100px 15px 85px; }
      .landing-feature { font-size: 17px; padding: 34px 7px 42px; }
      .dashboard .question { font-size: 23px; }
      .resource-card { padding: 26px; min-height: 178px; }
      .resource-card strong { font-size: 22px; }
      .resource-card .resource-description { font-size: 17px; }
      .mood-grid { gap: 11px; }
    }
    @media(max-width:620px) {
      .container { width: min(100% - 32px, 1385px); }
      .header-inner { padding-inline: 13px; height: 82px; }
      .brand-icon { width: 65px; height: 52px; }
      .brand-word { font-size: 25px; letter-spacing: -1.4px; }
      .brand.compact .brand-icon { width: 56px; height: 49px; }
      .brand.compact .brand-word { font-size: 23px; }
      .brand-subtitle { display: none; }
      .nav-right { gap: 11px; }
      .nav-right .nav-link { display: none; }
      .nav-link { font-size: 14px; }
      .nav-right .btn { padding: 8px 12px; min-height: 40px !important; min-width: auto !important; font-size: 14px !important; }
      .hero { padding: 80px 12px 70px; }
      .hero .eyebrow { font-size: 13px; }
      .hero h1 { font-size: 40px; }
      .hero p { font-size: 18px; margin-bottom: 31px; }
      .hero-actions { gap: 12px; }
      .btn-big { min-height: 53px; font-size: 17px; padding: 12px 20px; }
      .hero-actions .btn:first-child, .hero-actions .btn:last-child { min-width: 0; width: min(100%,280px); }
      .landing-features { grid-template-columns: repeat(2,1fr); }
      .landing-feature { border-bottom: 1px solid var(--border); }
      .landing-feature:nth-child(2) { border-right: none; }
      .about-section { padding: 55px 0; }
      .about-section h2 { font-size: 32px; }
      .about-grid,.content-grid,.choice-grid,.content-list,.support-grid,.resource-grid { grid-template-columns: 1fr; }
      .auth-page { padding: 22px 12px; }
      .auth-card { padding: 25px 18px; }
      .auth-card h1 { font-size: 28px; }
      .auth-lead { font-size: 16px; margin-bottom: 27px; }
      .auth-card .form-row label { font-size: 16px; }
      .auth-card .btn-block { min-height: 55px; font-size: 18px; }
      .auth-switch { font-size: 15px; }
      .dashboard { padding-top: 36px; }
      .dashboard .hello { font-size: 31px; }
      .dashboard .question { font-size: 20px; }
      .mood-grid { gap: 5px; }
      .mood-option { min-height: 72px; border-radius: 12px; }
      .mood-option .mood-graphic { width: 31px; height: 31px; }
      .section-label { font-size: 19px; }
      .resource-grid { gap: 15px; }
      .resource-card { min-height: 134px; padding: 19px 24px; }
      .resource-card .feature-icon { width: 32px; height: 32px; margin-bottom: 4px; }
      .resource-card strong { font-size: 19px; }
      .resource-card .resource-description { font-size: 15px; }
      .panel { padding: 20px 16px; }
      .answers { grid-template-columns: repeat(2,1fr); }
      .question-card { padding: 19px 14px; }
      .profile-top { gap: 13px; }
      .profile-avatar { width: 60px; height: 60px; }
      .account-pill { width: 47px; height: 47px; font-size: 16px; }
    }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior: auto; } *,*::before,*::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  /* ============================================================
     07. CONFIGURAÇÃO E PERSISTÊNCIA (PROTÓTIPO LOCAL)
     Os dados ficam apenas neste navegador. Não é seguro usar

  /* Senhas: PBKDF2 com salt individual, como melhoria didática ao texto puro.
     Isso NÃO transforma localStorage em solução segura para produção. */
  async function derivePassword(password,saltHex) {
    if(!crypto.subtle) throw new Error('Seu navegador não oferece criptografia segura neste contexto. Abra este arquivo em um navegador atualizado.');
    const encoder=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
    const salt=new Uint8Array(saltHex.match(/.{2}/g).map(x=>parseInt(x,16)));
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},key,256);
    return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function submitAuth(form,register) {
    if(authBusy) return;
    const fields=new FormData(form), email=String(fields.get('email')||'').trim().toLowerCase(),password=String(fields.get('password')||''), name=String(fields.get('name')||'').trim();
    if(register && name.length<2) return setError('Informe um nome de pelo menos 2 caracteres.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setError('Digite um e-mail válido.');
    if(password.length<8 && register) return setError('Sua senha precisa ter pelo menos 8 caracteres.');
    if(!password) return setError('Preencha sua senha.');
    if(register && db.accounts.some(a=>a.email===email)) return setError('Já existe uma conta com este e-mail. Entre com sua senha.');
    const btn=form.querySelector('[type="submit"]');
    authBusy=true; btn.disabled=true;btn.textContent='Aguarde…';
    try {
      if(register) {
        const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
        const hash=await derivePassword(password,salt);
        const user={id:createId(),name,email,salt,hash,createdAt:new Date().toISOString()};
        db.accounts.push(user);db.session=user.id;
        if(!saveDB()) {db.accounts.pop();db.session=null;return;}
        navigate('home');showToast('Sua conta foi criada. Boas-vindas ao MindSpace!');
      } else {
        const user=db.accounts.find(a=>a.email===email);
        if(!user || await derivePassword(password,user.salt)!==user.hash) {setError('E-mail ou senha incorretos.');return;}
        db.session=user.id;saveDB();navigate('home');showToast('Que bom ter você por aqui.');
      }
    } catch(err) {setError(err.message||'Não foi possível continuar.');}
    finally {authBusy=false;btn.disabled=false;btn.textContent=register?'Criar conta':'Entrar';}
  }

  function moodSelect(selected=3) {return `<select class="field" id="diary-mood" name="mood" required>${MOOD_LABELS.slice(1).map((label,i)=>`<option value="${i+1}" ${selected===(i+1)?'selected':''}>${label}</option>`).join('')}</select>`;}
  function timelineChart() {
    const valuesMap=new Map();
    [...userItems('moods').map(x=>({...x,priority:2})),...userItems('diary').map(x=>({...x,value:x.mood,priority:1}))].sort((a,b)=>a.priority-b.priority).forEach(x=>valuesMap.set(x.date,x.value));
    const points=[...valuesMap].sort((a,b)=>a[0].localeCompare(b[0])).slice(-10);
    if(!points.length) return `<div class="empty-state">${icon('calendar')}<p>Seu gráfico aparecerá assim que você registrar seu humor.</p></div>`;
    const w=590,h=245,l=40,r=15,t=25,b=52,plotW=w-l-r,plotH=h-t-b;
    const coord=points.map(([date,value],i)=>({date,value,x:l+(points.length===1?plotW/2:(i*plotW/(points.length-1))),y:t+(5-value)*plotH/4}));
    const grid=[1,2,3,4,5].map(value=>{const y=t+(5-value)*plotH/4;return `<line x1="${l}" y1="${y}" x2="${w-r}" y2="${y}" stroke="#d4e7e0" stroke-dasharray="4 5"/><text x="${l-13}" y="${y+4}" font-size="12" fill="#577e75" text-anchor="middle">${value}</text>`;}).join('');
    const polyline=coord.length>1?`<polyline points="${coord.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#159777" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`:'';
    const dots=coord.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#149775" stroke="white" stroke-width="2"><title>${escapeHTML(formatDate(p.date))}: ${MOOD_LABELS[p.value]}</title></circle><text x="${p.x}" y="${h-19}" font-size="${points.length>7?'10':'12'}" fill="#547d74" text-anchor="middle">${p.date.slice(8)}/${p.date.slice(5,7)}</text>`).join('');
    return `<div class="chart-wrap"><svg role="img" aria-label="Evolução do humor dos últimos ${points.length} dias registrados, escala de 1 a 5" viewBox="0 0 ${w} ${h}" width="590" height="245">${grid}${polyline}${dots}</svg></div><p class="chart-caption">Escala de 1 (muito triste) a 5 (muito bem). Exibidos até 10 dias registrados.</p>`;
  }

    else records.push({id:createId(),date,mood,text,createdAt:new Date().toISOString()});

  /* ============================================================
     12. TRIAGENS EDUCATIVAS PHQ-9 E GAD-7
     As perguntas do PHQ-9 e do GAD-7 seguem a versão em português
     do Brasil (Anexos A e B do protocolo de Sergipe, SUS). São
     instrumentos de triagem, não de diagnóstico.
     ============================================================ */
  const PHQ = [
    'Pouco interesse ou pouco prazer em fazer as coisas',
    'Se sentir “para baixo”, deprimido/a ou sem perspectiva',
    'Dificuldade para pegar no sono ou permanecer dormindo, ou dormir mais do que de costume',
    'Se sentir cansado/a ou com pouca energia',
    'Falta de apetite ou comendo demais',
    'Se sentir mal consigo mesmo/a — ou achar que você é um fracasso ou que decepcionou sua família ou você mesmo/a',
    'Dificuldade para se concentrar nas coisas, como ler o jornal ou ver televisão',
    'Lentidão para se movimentar ou falar, a ponto das outras pessoas perceberem? Ou o oposto – estar tão agitado/a ou irrequieto/a que você fica andando de um lado para o outro muito mais do que de costume',
    'Pensar em se ferir de alguma maneira ou que seria melhor estar morto/a'
  ];
  const GAD = [
    'Sentir-se nervoso/a, ansioso/a ou muito tenso/a',
    'Não ser capaz de impedir ou de controlar as preocupações',
    'Preocupar-se muito com diversas coisas',
    'Dificuldade para relaxar',
    'Ficar tão agitado/a que se torna difícil permanecer sentado/a',
    'Ficar facilmente aborrecido/a ou irritado/a',
    'Sentir medo como se algo horrível fosse acontecer'
  ];
  const RESPONSES=['Nenhuma vez','Vários dias','Mais da metade dos dias','Quase todos os dias'];
  function scoreBand(type,score) {
    return type==='phq9' ? (score<=4?'Mínima':score<=9?'Leve':score<=14?'Moderada':score<=19?'Moderadamente grave':'Grave') : (score<=4?'Mínima':score<=9?'Leve':score<=14?'Moderada':'Grave');
  }
  function assessmentPage(type='',id='') {
    if(type==='result') return assessmentResultPage(id);
    if(type==='phq9'||type==='gad7') return assessmentFormPage(type);
    const recent=[...userItems('assessments')].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    return pageLayout(`${backButton()}<div class="section-heading"><h1>Autoavaliação</h1><p>Um jeito de observar como você tem se sentido nas últimas duas semanas. Não é um diagnóstico.</p></div><div class="choice-grid"><button class="choice-card" data-nav="assessment/phq9">${icon('heart','feature-icon')}<h3>PHQ-9</h3><p>Questionário sobre sintomas depressivos · 9 perguntas · pontuação demonstrativa.</p></button><button class="choice-card" data-nav="assessment/gad7">${icon('assessment','feature-icon')}<h3>GAD-7</h3><p>Questionário sobre sintomas de ansiedade · 7 perguntas · resultado orientativo.</p></button></div><div class="note note-warning" style="margin-top:24px">Estes questionários são instrumentos de triagem e <strong>não substituem avaliação profissional</strong>. Se você estiver em sofrimento, procure ajuda: o CVV atende pelo 188, 24 horas.</div><p class="small text-muted" style="margin-top:13px">Fonte: <a href="https://www.funesa.se.gov.br/wp-content/uploads/2025/03/protocolo-clinico-terapeutico-digital-final.pdf" target="_blank" rel="noopener noreferrer">PHQ-9 (anexo A) e GAD-7 (anexo B) · Protocolo de Sergipe, SUS</a>.</p><section class="soft-card panel" style="margin-top:28px"><h2>Histórico de resultados</h2>${recent.length?recent.map(res=>`<div class="history-row"><div><strong>${res.type==='phq9'?'PHQ-9':'GAD-7'} · ${res.score} pontos</strong><small>${formatDateTime(res.createdAt)}</small></div><button class="btn btn-outline btn-small" data-nav="assessment/result/${encodeURIComponent(res.id)}">Ver resultado</button></div>`).join(''):`<div class="empty-state">${icon('assessment')}<p>Seus resultados vão aparecer aqui quando você preencher uma autoavaliação.</p></div>`}</section>`);
  }
  function assessmentFormPage(type) {
    const questions=type==='phq9'?PHQ:GAD;
    return pageLayout(`${backButton()}<div class="section-heading"><div class="eyebrow">${type==='phq9'?'PHQ-9 · bem-estar emocional':'GAD-7 · ansiedade'}</div><h1>${type==='phq9'?'Como tem estado seu ânimo?':'Como têm estado suas preocupações?'}</h1><p>Durante as <strong>últimas 2 semanas</strong>, com que frequência você foi incomodado(a) pelos problemas abaixo?</p></div><form data-form="assessment" data-type="${type}" novalidate><div class="note" style="margin-bottom:22px">Selecione uma resposta em cada pergunta. 0 = nenhuma vez e 3 = quase todos os dias.</div>${questions.map((q,i)=>`<div class="soft-card question-card"><fieldset><legend>${i+1}. ${escapeHTML(q)}</legend><div class="answers">${RESPONSES.map((a,value)=>`<label class="answer"><input type="radio" name="q${i}" value="${value}" required><span>${value} · ${a}</span></label>`).join('')}</div></fieldset></div>`).join('')}${type==='phq9'?'<p class="note">Se algum desses pensamentos estiver presente, você não precisa passar por isso sozinho(a): o CVV atende pelo <a href="tel:188">188</a>, 24 horas, de graça.</p>':''}<div class="wrap-actions" style="margin-top:25px"><button type="submit" class="btn btn-primary">Calcular meu resultado</button><button type="button" class="btn btn-outline" data-nav="assessment">Cancelar</button></div></form>`);
  }
  function submitAssessment(form) {
    const type=form.dataset.type;const questions=type==='phq9'?PHQ:GAD;
    const responses=questions.map((_,i)=>form.querySelector(`input[name="q${i}"]:checked`));
    if(responses.some(x=>!x)) {const first=responses.findIndex(x=>!x);showToast(`Responda à pergunta ${first+1} para continuar.`);form.querySelectorAll('.question-card')[first].scrollIntoView({behavior:'smooth',block:'center'});return;}
    const answers=responses.map(el=>Number(el.value));const score=answers.reduce((sum,v)=>sum+v,0);
    const result={id:createId(),type,answers,score,band:scoreBand(type,score),needsSupport:(type==='phq9'&&(answers[8]>0||score>=15))||(type==='gad7'&&score>=15),createdAt:new Date().toISOString()};
    userItems('assessments').push(result);
    if(saveDB())navigate(`assessment/result/${result.id}`);
  }
  function assessmentResultPage(id) {
    const res=userItems('assessments').find(r=>r.id===id);
    if(!res) return pageLayout(`${backButton()}<div class="empty-state">Resultado não encontrado.</div>`);
    const severe=res.needsSupport;
    return pageLayout(`${backButton()}<div class="section-heading"><h1>Seu resultado</h1><p>${res.type==='phq9'?'PHQ-9 · Triagem orientativa':'GAD-7 · Triagem orientativa'} · ${formatDateTime(res.createdAt)}</p></div><div class="soft-card result-hero"><p class="text-muted" style="margin-bottom:0">Pontuação obtida</p><div class="result-number">${res.score}<span style="font-size:20px;color:var(--muted);font-weight:500"> / ${res.type==='phq9'?'27':'21'}</span></div><p class="result-band">Faixa: ${escapeHTML(res.band)}</p><p>Obrigado por dedicar esse tempo a observar como você tem se sentido. Uma pontuação não define você. Considere compartilhar suas preocupações com um profissional ou alguém de confiança.</p><div class="note note-warning"><strong>Este questionário é uma triagem e não um diagnóstico. Só um profissional de saúde pode avaliar.</strong></div></div>
      ${severe?`<div class="danger-note" style="margin-top:23px"><h2 style="font-size:21px;margin:0 0 8px">Você merece apoio agora</h2><p>Este resultado sugere que conversar com alguém preparado para ajudar é importante. Procure um CAPS, UBS ou outro profissional de saúde. O CVV oferece escuta gratuita e sigilosa pelo <strong>188, 24 horas por dia</strong>.</p><div class="wrap-actions"><a class="btn btn-primary" href="tel:188">${icon('support')} Ligar 188 (CVV)</a><button class="btn btn-outline" data-nav="support">Encontrar apoio</button></div><p class="small" style="margin:14px 0 0">Em uma emergência imediata, ligue 192 (SAMU).</p></div>`:''}
      <div class="wrap-actions" style="margin-top:25px"><button class="btn btn-primary" data-nav="assessment">Voltar às avaliações</button><button class="btn btn-outline" data-nav="support">Ver apoio profissional</button></div>`);
  }
  /* ============================================================
     13. CONTEÚDO EDUCATIVO E PRÁTICAS SIMPLES
     ============================================================ */
  const ARTICLES = [
    {id:'respiracao',icon:'wind',category:'Técnicas de respiração',title:'Faça uma pausa para respirar',desc:'Um ritmo suave para desacelerar.',steps:['Sente-se em um lugar confortável, se possível.','Inspire pelo nariz sem forçar o ar.','Expire devagar e retome seu ritmo natural.','Se ficar desconfortável, pare e respire normalmente.']},
    {id:'mindfulness',icon:'leaf',category:'Mindfulness',title:'Volte a atenção ao presente',desc:'Observe o momento com gentileza.',steps:['Escolha um lugar em que você se sinta à vontade.','Observe três coisas que pode ver ao seu redor.','Perceba dois sons e uma sensação confortável.','Volte à atividade sem se cobrar por distrações.']},
    {id:'expressao',icon:'pen',category:'Expressão emocional',title:'Escrever o que sente',desc:'Organize pensamentos sem precisar encontrar as palavras perfeitas.',steps:['Comece com a frase: “Hoje eu me sinto…”.','Escreva sem tentar corrigir ou julgar o que sente.','Se quiser, identifique algo de que precisa.','Guarde sua anotação ou compartilhe com alguém de confiança.']},
    {id:'ansiedade',icon:'heart',category:'Controle da ansiedade',title:'Pequenos passos para lidar com preocupações',desc:'Ideias para momentos de tensão.',steps:['Dê um nome ao que está sentindo, sem se criticar.','Olhe à sua volta e reconheça o que é seguro neste momento.','Escolha uma pequena tarefa possível de fazer agora.','Busque apoio se a preocupação estiver atrapalhando sua rotina.']},
    {id:'pensamentos',icon:'brain',category:'Pensamentos negativos',title:'Questione pensamentos difíceis com gentileza',desc:'Nem todo pensamento é um fato.',steps:['Perceba o pensamento que está causando desconforto.','Pergunte: “Que fatos sustentam essa ideia? Há outra explicação?”.','Imagine como falaria com um amigo na mesma situação.','Se persistir, converse com alguém de confiança ou um profissional.']},
    {id:'bemestar',icon:'smile',category:'Bem-estar',title:'Cuidados simples no dia a dia',desc:'Pequenas ações que podem trazer conforto.',steps:['Procure respeitar seus horários de descanso.','Reserve um momento para alguma atividade agradável.','Mantenha contato com pessoas que fazem você se sentir acolhido.','Lembre-se de que pedir ajuda faz parte de se cuidar.']}
  ];
  function educationPage(id='') {
    const article=ARTICLES.find(x=>x.id===id);
    if(article) return pageLayout(`${backButton()}<div class="section-heading"><div class="eyebrow">${escapeHTML(article.category)}</div><h1>${escapeHTML(article.title)}</h1><p>${escapeHTML(article.desc)}</p></div><article class="soft-card panel" style="max-width:810px"><h2>Passo a passo</h2><ol class="step-list">${article.steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><div class="note">Faça apenas o que for confortável para você. Essas orientações são educativas e não substituem orientação individual de um profissional.</div>${article.id==='respiracao'?'<button class="btn btn-primary" style="margin-top:22px" data-nav="breathing">Iniciar respiração guiada</button>':''}</article>`);
    return pageLayout(`${backButton()}<div class="section-heading"><h1>Conteúdo educativo</h1><p>Descubra pequenas práticas para se conhecer e cuidar de si, no seu próprio ritmo.</p></div><div class="content-list"><button class="content-tile" data-nav="breathing">${icon('wind','feature-icon')}<h3>Respiração guiada interativa</h3><p>Uma animação com tempos de inspirar, segurar e expirar.</p><span class="tag">Exercício interativo →</span></button>${ARTICLES.map(a=>`<button class="content-tile" data-nav="education/${a.id}">${icon(a.icon,'feature-icon')}<h3>${escapeHTML(a.category)}</h3><p>${escapeHTML(a.title)}</p><span class="tag">Ler conteúdo →</span></button>`).join('')}</div>`);
  }
  /* Temporizador: 4 segundos inspirando, 4 mantendo e 6 expirando.
     Nunca força a respiração; a pessoa pode interromper a qualquer momento. */
  const BREATH_PHASES=[{name:'Inspire',seconds:4,cls:'inspire'},{name:'Segure',seconds:4,cls:'hold'},{name:'Expire',seconds:6,cls:'expire'}];
  function breathingPage() {
    return pageLayout(`${backButton()}<div class="section-heading"><h1>Respiração guiada</h1><p>Acompanhe o círculo no seu ritmo. Não é necessário forçar a respiração.</p></div><section class="soft-card breath-panel" style="max-width:650px;margin:0 auto"><div class="eyebrow" style="font-size:13px">Um momento para você</div><div class="breath-circle-stage"><div id="breathCircle" class="breath-circle"><span id="breathCountdown" class="breath-count" aria-hidden="true">4</span></div></div><div id="breathPhase" class="breath-label" aria-live="polite">Pronto para começar?</div><p class="text-muted" id="breathCycles">Ciclos concluídos: 0</p><div class="wrap-actions" style="justify-content:center"><button id="breathStart" class="btn btn-primary" type="button" data-action="breath-start">Começar</button><button class="btn btn-outline" type="button" data-action="breath-stop">Parar / reiniciar</button></div><p class="small text-muted" style="max-width:420px;margin:25px auto 0">Se sentir desconforto ou tontura, interrompa o exercício e volte à respiração natural. Você pode pular a etapa de segurar o ar.</p></section>`);
  }
  function resetBreathingUI() {
    const circle=document.getElementById('breathCircle');if(!circle)return;
    circle.className='breath-circle';document.getElementById('breathCountdown').textContent='4';document.getElementById('breathPhase').textContent='Pronto para começar?';document.getElementById('breathCycles').textContent='Ciclos concluídos: 0';document.getElementById('breathStart').textContent='Começar';
  }
  function stopBreathing() { if(breathingTimer!==null) clearInterval(breathingTimer);breathingTimer=null;breathingState=null; }
  function startBreathing() {
    stopBreathing();breathingState={phase:0,cycles:0,start:Date.now()};
    updateBreathing(true);breathingTimer=setInterval(()=>updateBreathing(false),120);
    document.getElementById('breathStart').textContent='Recomeçar';
  }
  function updateBreathing(force) {
    if(!breathingState)return;
    const st=breathingState;let seconds=(Date.now()-st.start)/1000;let phase=BREATH_PHASES[st.phase];
    if(seconds>=phase.seconds){ st.phase=(st.phase+1)%3;if(st.phase===0)st.cycles++;st.start=Date.now();phase=BREATH_PHASES[st.phase];seconds=0;force=true; }
    const n=Math.max(1,Math.ceil(phase.seconds-seconds));
    const circle=document.getElementById('breathCircle');if(!circle){stopBreathing();return;}
    if(force){circle.className=`breath-circle ${phase.cls}`;document.getElementById('breathPhase').textContent=phase.name;document.getElementById('breathCycles').textContent=`Ciclos concluídos: ${st.cycles}`;}
    document.getElementById('breathCountdown').textContent=String(n);
  }
  /* ============================================================
     14. APOIO PROFISSIONAL, SITES OFICIAIS E PERFIL
     ============================================================ */
  function supportPage() {
    return pageLayout(`${backButton()}<div class="section-heading"><h1>Apoio profissional</h1><p>Buscar acolhimento é importante. Conheça opções gratuitas de atendimento e orientação.</p></div><div class="note note-warning" style="margin-bottom:24px"><strong>Em risco imediato:</strong> ligue <a href="tel:192">192 (SAMU)</a> para emergência. Você também pode conversar pelo <a href="tel:188">188 (CVV)</a>, gratuitamente, a qualquer hora.</div><div class="support-grid"><article class="soft-card support-card">${icon('support','feature-icon')}<h2>CVV · 188</h2><p>Centro de Valorização da Vida: escuta acolhedora e sigilosa, 24 horas por dia, com ligação gratuita.</p><div class="wrap-actions"><a class="btn btn-primary" href="tel:188">Ligar 188</a><a class="btn btn-outline" target="_blank" rel="noopener noreferrer" href="https://www.cvv.org.br">Site do CVV ${icon('external')}</a></div></article><article class="soft-card support-card">${icon('heart','feature-icon')}<h2>CAPS · SUS</h2><p>Centros de Atenção Psicossocial oferecem acolhimento pelo SUS. Procure a UBS ou Secretaria de Saúde da sua cidade para localizar o CAPS mais próximo.</p><div class="wrap-actions"><a class="btn btn-primary" href="https://www.gov.br/saude/pt-br/composicao/saes/desmad/raps/caps/caps/" target="_blank" rel="noopener noreferrer">Saiba mais sobre CAPS ${icon('external')}</a></div></article><article class="soft-card support-card">${icon('user','feature-icon')}<h2>UBS · Unidade Básica de Saúde</h2><p>As UBS oferecem atendimento inicial gratuito pelo SUS e podem orientar você sobre serviços de saúde mental na região.</p><div class="wrap-actions"><a class="btn btn-outline" href="https://www.gov.br/saude/pt-br" target="_blank" rel="noopener noreferrer">Ministério da Saúde ${icon('external')}</a></div></article><article class="soft-card support-card">${icon('support','feature-icon')}<h2>SAMU · 192</h2><p>Serviço público gratuito de atendimento de urgência, disponível 24 horas por dia.</p><div class="wrap-actions"><a class="btn btn-primary" href="tel:192">Ligar 192</a><a class="btn btn-outline" href="https://www.gov.br/saude/pt-br/composicao/saes/samu-192" target="_blank" rel="noopener noreferrer">Site oficial ${icon('external')}</a></div></article></div><div class="note" style="margin-top:25px">Este site não oferece consulta, diagnóstico nem atendimento emergencial. Em uma situação difícil, converse também com alguém de sua confiança.</div>`);
  }
  function profilePage() {
    const u=sessionUser();const moods=[...userItems('moods')].sort((a,b)=>b.date.localeCompare(a.date));
    return pageLayout(`${backButton()}<div class="section-heading"><h1>Meu perfil</h1><p>Seu espaço, suas informações e seu histórico.</p></div><div class="content-grid"><section class="soft-card panel"><div class="profile-top"><div class="profile-avatar">${escapeHTML(initials(u.name))}</div><div><h2>${escapeHTML(u.name)}</h2><p>${escapeHTML(u.email)}</p></div></div><form data-form="profile" novalidate><div class="form-row"><label for="profile-name">Nome de exibição</label><input class="field" id="profile-name" name="name" required maxlength="80" value="${escapeHTML(u.name)}"></div><button class="btn btn-primary" type="submit">Salvar nome</button></form><hr style="border:0;border-top:1px solid var(--border);margin:24px 0"><div class="wrap-actions"><button class="btn btn-outline" data-action="logout">Sair da conta</button><button class="btn btn-danger" data-action="delete-account">${icon('trash')} Apagar todos os dados da conta</button></div><p class="small text-muted" style="margin-top:20px">A exclusão é irreversível e apaga cadastro, diário, humor e avaliações deste navegador.</p></section><section class="soft-card panel"><h2>Histórico de humor</h2>${moods.length?moods.map(m=>`<div class="history-row"><div><strong>${escapeHTML(formatDate(m.date))}</strong><small>${escapeHTML(MOOD_LABELS[m.value])}</small></div><span class="tag">${moodSVG(m.value)} ${escapeHTML(MOOD_LABELS[m.value])}</span></div>`).join(''):`<div class="empty-state">${icon('smile')}<p>Seu histórico aparecerá quando você registrar seu humor no painel.</p></div>`}</section></div>`);
  }
  /* ============================================================
     15. EVENTOS: clique e envio de formulários
     Evitamos atributos onclick nos elementos HTML.
     ============================================================ */
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');
    if(nav){e.preventDefault();navigate(nav.dataset.nav);return;}
    const action=e.target.closest('[data-action]');
    if(!action)return;
    e.preventDefault();
    switch(action.dataset.action) {
      case 'back': goBack();break;
      case 'mood': chooseMood(Number(action.dataset.value));break;
      case 'logout': db.session=null;saveDB();navigate('landing');showToast('Você saiu da conta.');break;
      case 'forgot': showToast('Neste protótipo offline não há recuperação de senha por e-mail. Em produção, será feita pelo servidor.');break;
      case 'delete-entry': {
        if(!confirm('Deseja excluir definitivamente este registro do diário?'))return;
        const entries=userItems('diary');const index=entries.findIndex(x=>x.id===action.dataset.id);
        if(index!==-1){entries.splice(index,1);saveDB();render();showToast('Registro excluído.');} break;
      }
      case 'delete-account': {
        if(!confirm('Tem certeza? Sua conta e todos os seus registros serão apagados permanentemente deste navegador.'))return;
        if(!confirm('Confirme mais uma vez: não será possível recuperar os dados.'))return;
        const id=db.session;db.accounts=db.accounts.filter(u=>u.id!==id);
        ['moods','diary','assessments'].forEach(key=>{if(db[key])delete db[key][id];});
        db.session=null;saveDB();navigate('landing');showToast('Dados da conta apagados deste navegador.');break;
      }
      case 'breath-start': startBreathing();break;
      case 'breath-stop': stopBreathing();resetBreathingUI();break;
    }
  });
  document.addEventListener('submit', async e=>{
    const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();
    if(form.dataset.form==='register') await submitAuth(form,true);
    if(form.dataset.form==='login') await submitAuth(form,false);
    if(form.dataset.form==='diary') submitDiary(form);
    if(form.dataset.form==='assessment') submitAssessment(form);
    if(form.dataset.form==='profile') {
      const name=String(new FormData(form).get('name')||'').trim();
      if(name.length<2){showToast('O nome deve conter ao menos 2 caracteres.');return;}
      sessionUser().name=name;saveDB();render();showToast('Nome atualizado!');
    }
  });
  /* Âncoras #sobre: não representam rota; rolam para a seção Sobre. */
  document.addEventListener('click',e=>{
    const link=e.target.closest('a[href="#sobre"]');
    if(!link)return;e.preventDefault();
    if(!currentPage.startsWith('landing'))navigate('landing');
    requestAnimationFrame(()=>document.querySelector('#sobre')?.scrollIntoView({behavior:'smooth'}));
  });
  if(location.hash==='#sobre')history.replaceState(null,'','#landing');
  render();
  </script>
</body>
</html>
